[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quantops-contracts"
version = "0.1.0"
description = "Versioned, deterministic event contracts for QuantOps"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "QuantOps contributors" }]
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
test = [
  "hypothesis>=6.139,<7",
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantops_contracts"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quantops_contracts"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
