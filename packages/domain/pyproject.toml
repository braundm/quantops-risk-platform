[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quantops-domain"
version = "0.1.0"
description = "Framework-independent domain model for QuantOps"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "QuantOps contributors" }]
dependencies = []

[project.optional-dependencies]
test = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["quantops_domain"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
