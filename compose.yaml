name: quantops

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: quantops
      POSTGRES_USER: quantops
      POSTGRES_PASSWORD: ${QUANTOPS_POSTGRES_PASSWORD:-quantops_local}
    ports:
      - "5432:5432"
    volumes:
      - quantops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantops -d quantops"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [quantops-core]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      QUANTOPS_ENVIRONMENT: development
      QUANTOPS_DEMO_MODE: "true"
      QUANTOPS_DEMO_API_TOKEN: ${QUANTOPS_DEMO_API_TOKEN:-replace-with-a-local-random-token}
      QUANTOPS_DATABASE_URL: postgresql+asyncpg://quantops:${QUANTOPS_POSTGRES_PASSWORD:-quantops_local}@postgres:5432/quantops
      QUANTOPS_CORS_ORIGINS: http://localhost:5173
      QUANTOPS_AI_PROVIDER: deterministic
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [quantops-core]
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [quantops-core]

networks:
  quantops-core:
    driver: bridge

volumes:
  quantops-postgres:
