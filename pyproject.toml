[project]
name = "quantops-workspace"
version = "0.1.0"
description = "Market Risk, Data, and Grounded AI Research Platform"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "hypothesis>=6.139,<7",
  "httpx2==2.7.0",
  "mypy==2.3.0",
  "pip-audit>=2.9,<3",
  "pytest==9.1.1",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff==0.15.20",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/mcp_server",
  "apps/scheduler",
  "apps/stream_worker",
  "ml",
  "packages/ai_engine",
  "packages/data_contracts",
  "packages/domain",
  "packages/risk_engine",
  "pipelines",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
testpaths = ["apps", "packages", "pipelines", "ml", "tests"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "integration: requires an external service such as PostgreSQL or Redpanda",
  "contract: validates a versioned public or event contract",
  "e2e: exercises a running application through a browser",
]

[tool.coverage.run]
branch = true
source = ["apps", "packages", "pipelines", "ml"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data/generated", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "DTZ", "PTH", "S", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"apps/api/alembic/**" = ["E501"]
"scripts/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
  "apps/api",
  "apps/mcp_server",
  "apps/scheduler/src",
  "apps/stream_worker/src",
  "ml/src",
  "packages/ai_engine/src",
  "packages/domain",
  "packages/risk_engine/src",
  "packages/data_contracts/src",
  "packages/shared",
  "pipelines",
]
exclude = ["apps/api/alembic/versions"]

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*"]
ignore_missing_imports = true
