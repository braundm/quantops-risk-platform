[project]
name = "quantops-mcp-server"
version = "0.1.0"
description = "Read-only MCP adapter for the QuantOps deterministic application service"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "QuantOps contributors" }]
dependencies = [
  "mcp>=1.28.1,<2",
  "pydantic==2.13.4",
  "quantops-api==0.1.0",
]

[project.optional-dependencies]
test = [
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<0.16",
]

[project.scripts]
quantops-mcp = "quantops_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantops_mcp"]

[tool.uv.sources]
quantops-api = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = ["contract: validates the MCP protocol surface"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_unreachable = true
show_error_codes = true
mypy_path = [
  "apps/mcp_server",
  "apps/api",
  "packages/domain",
  "packages/risk_engine/src",
  "packages/data_contracts/src",
]
