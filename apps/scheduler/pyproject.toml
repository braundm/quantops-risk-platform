[project]
name = "quantops-scheduler"
version = "0.1.0"
description = "Offline-first orchestration wrappers for existing QuantOps jobs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "quantops-ai-engine==0.1.0",
  "quantops-ml==0.1.0",
  "quantops-pipelines==0.1.0",
]

[project.optional-dependencies]
test = [
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantops_scheduler"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "DTZ", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_unreachable = true
show_error_codes = true
mypy_path = [
  "apps",
  "apps/scheduler/src",
  "packages/ai_engine/src",
  "ml/src",
  "pipelines/src",
]

[tool.uv.sources]
quantops-ai-engine = { workspace = true }
quantops-ml = { workspace = true }
quantops-pipelines = { workspace = true }
