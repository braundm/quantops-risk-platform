[project]
name = "quantops-stream-worker"
version = "0.1.0"
description = "Framework-independent deterministic streaming and outbox worker"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "quantops-contracts==0.1.0",
  "quantops-domain==0.1.0",
]

[project.optional-dependencies]
test = [
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantops_stream_worker"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "DTZ", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_unreachable = true
show_error_codes = true
mypy_path = [
  "apps",
  "apps/stream_worker/src",
  "packages/data_contracts/src",
  "packages/domain",
]

[tool.uv.sources]
quantops-contracts = { workspace = true }
quantops-domain = { workspace = true }
