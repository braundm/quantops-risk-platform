[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quantops-pipelines"
version = "0.1.0"
description = "Deterministic, CLI-first synthetic data pipelines for QuantOps"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "QuantOps" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.1", "pytest-cov>=7"]

[project.scripts]
quantops-data = "quantops_pipelines.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantops_pipelines"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quantops_pipelines"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]
